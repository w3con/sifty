# Job-search inputs. Edit this file to change sources and search terms.
# Shared discovery contract for the local catalogue, CLI and stdio MCP server.
version: 1

# Add a source by copying one list item. Set enabled: false to pause it.
# A URL registers a source; automated collection/application support must be
# implemented and verified for each site. The app must flag unsupported sources.
sites:
  - name: Web3 Careers
    url: https://web3.career
    enabled: true
  - name: Braintrust
    url: https://www.usebraintrust.com/jobs
    enabled: true
  - name: CryptoJobList
    url: https://cryptojobslist.com/
    enabled: true
  - name: Cryptocurrency Jobs
    url: https://cryptocurrencyjobs.co/
    enabled: true
  - name: Remote3
    url: https://www.remote3.co/
    enabled: true
  - name: Paradigm
    url: https://www.paradigm.xyz/careers
    enabled: true
  - name: Electric Capital
    url: https://jobs.electriccapital.com/jobs
    enabled: true
  - name: A16z
    url: https://a16zfrontier.com/jobs/
    enabled: true
  - name: Multicoin capital
    url: https://jobs.multicoin.capital/jobs
    enabled: true
  - name: Framework ventures
    url: https://jobs.framework.ventures/companies
    enabled: true
  - name: Wellfound
    url: https://wellfound.com/jobs
    enabled: true
  - name: Hacker News — Who is hiring?
    url: https://news.ycombinator.com/
    enabled: true
  - name: We Work Remotely
    url: https://weworkremotely.com/
    enabled: true
  - name: Remotive
    url: https://remotive.com/
    enabled: true
  - name: Welcome to the Jungle
    url: https://www.welcometothejungle.com/
    enabled: true
  # Marketplace/profile channel, not a conventional job board.
  # Requires its own integration; enabled does not imply support is verified.
  - name: Malt
    url: https://www.malt.fr/
    enabled: true

search:
  # Titles and keywords are alternative search queries (OR), not requirements
  # that must all appear in a listing. Matching is case-insensitive.
  # Examples of list syntax:
  #   - "Solidity engineer"
  #   - "Fractional CTO"
  titles:
    - "Blockchain developer"
    - "Blockchain engineer"
    - "Fractional CTO"
    - "Development Lead"
    - "Engineering Lead"
    - "Project Manager"
    - "Software engineer"
    - "Blockchain architect"
    - "ai engineer"
    - "ai developer"
    - "Smart Contract Engineer"
    - "Solidity Developer"
    - "Protocol Engineer"
    - "Senior Software Engineer"
    - "Staff Engineer"
    - "Principal Engineer"
    - "Tech Lead"
    - "Engineering Manager"
    - "Head of Engineering"
    - "CTO"
    - "Interim CTO"
    - "Technical Project Manager"
    - "Technical Program Manager"
    - "AI Automation Engineer"
    - "AI Agent Engineer"
    - "LLM Engineer"

  # Technologies, skills or other phrases to search for.
  # Examples: "Rust", "AI agents", "technical due diligence".
  keywords:
    - "Rust"
    - "Solidity"
    - "Polkadot"
    - "Nodejs"
    - "Node.js"
    - "Web3js"
    - "Web3.js"
    - "Smart contracts"
    - "Blockchain architecture"
    - "layer2"
    - "Layer 2"
    - "L2"
    - "TypeScript"
    - "Substrate"
    - "Ethereum"
    - "EVM"
    - "DeFi"
    - "staking"
    - "tokenomics"
    - "AI agents"
    - "agentic"
    - "LLM"
    - "workflow automation"
    - "developer tooling"
    - "technical due diligence"

  # Empty lists mean no explicit search queries yet, not "fetch every job".
  # These terms guide discovery; the model uses the CV and KB to rank results.
  # Full-time and other potentially useful roles are not excluded here.

# Ranking preferences, not hard exclusions or independent search queries.
# Missing engagement, location or salary information must not exclude a job.
preferences:
  engagement:
    preferred:
      - contract
      - freelance
      - part-time
      - fractional
      - interim
    allow_full_time: true

  work_arrangement:
    preferred:
      - remote
    allow_hybrid: true
    allow_onsite: true
