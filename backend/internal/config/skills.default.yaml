# Skill and technology vocabulary of the requirement matcher (docs/specs/quick-match.md section 14.12).
#
# A requirement that names a technology is matched against the profile by code before any model is
# asked: when every named technology (or, for a list of alternatives, any one of them) is in the
# profile, the requirement is a match and the model never sees it. This file is the one place the
# vocabulary lives. It is the built-in default; a file config/skills.yaml in the data directory
# replaces it as a whole. Changing it re-runs the matching pass (it is part of the matcher
# version) and never the extraction.
#
# groups: names that mean the same thing. `terms` are spelled-out synonyms, matched as whole words
# without regard to case. `ambiguous_terms` are common words or one-letter names (Go, C, R, TS) that
# count only in a technology context: a profile skill of exactly that name, a member of a list of
# alternatives, the whole requirement, or a capitalised occurrence next to a technology-context word.
# The group's `name` counts as a term unless it is listed under ambiguous_terms.
version: 1

# Words that show that a neighbouring ambiguous term is a technology ("Go language", "R programming").
technology_context:
  - language
  - languages
  - programming
  - developer
  - development
  - engineer
  - engineering
  - stack
  - backend
  - back-end
  - frontend
  - front-end
  - fullstack
  - full-stack
  - framework
  - library
  - code
  - coding
  - scripting
  - services
  - microservices
  - tooling

