name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leak scanner self-test
        run: python3 scripts/leakcheck/leakcheck-selftest
      - name: Whole-tree leak sweep
        run: python3 scripts/leakcheck/tree-check

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test
        run: bash scripts/test
