# Ordinary words that stand for a kind of technology. A requirement that says "cloud platform" is
# compared with passages that say AWS, GCP or Azure. Used only to choose the passages the model is
# shown; whether a passage answers the requirement is still the model's judgement.
categories:
  - words: [cloud, clouds]
    groups: [AWS, GCP, Azure]
  - words: [database, databases, datastore, datastores]
    groups: [PostgreSQL, MySQL, MongoDB, Redis, SQLite, SQL, BigQuery, Snowflake, Elasticsearch]
  - words: [container, containers, containerisation, containerization, orchestration]
    groups: [Docker, Kubernetes]
  - words: [iac]
    groups: [Terraform, Kubernetes, AWS]
  - words: [observability, monitoring, alerting, metrics]
    groups: [Prometheus, Grafana]
  - words: [messaging, streaming, broker, brokers]
    groups: [Kafka]
  - words: [frontend, ui]
    groups: [React, Vue, Angular, TypeScript, JavaScript, Next.js]
  - words: [backend]
    groups: [Go, Python, Rust, Java, Kotlin, Scala, Ruby, PHP, Elixir, Node.js, C#, .NET]
  - words: [blockchain, web3, crypto, defi, onchain]
    groups: [Ethereum, Solidity, Smart contracts, Web3]
