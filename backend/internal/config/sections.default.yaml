# Section heading vocabulary for the listing view (By section).
# Each entry maps a class label to the heading patterns that belong to it.
# Matching normalises apostrophes, ampersands, whitespace and trailing punctuation.
# Three levels are tried in order:
#   headings: exact match after normalisation.
#   prefix:   heading starts with this word/phrase + space (e.g. "about chainlink").
#   contains: heading contains this word as a whole word (e.g. "responsibilities").
# Headings not found here are classified as "other".
version: 1
sections:
  - class: About
    headings:
      - about us
      - about the company
      - about the team
      - about the firm
      - who we are
      - company overview
      - company background
      - about
      - our culture
      - culture
      - recent recognition
      - our values
      - get to know us
      - our story
      - what we do
      - who we are as a company
    prefix:
      - about
    contains:
      - recognition
